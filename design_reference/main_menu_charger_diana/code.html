<html class="dark" lang="id"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Rock+Salt&amp;family=Special+Elite&amp;family=VT323&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.crt-overlay{background:linear-gradient(rgba(18,16,16,0) 50%,rgba(0,0,0,0.4) 50%),linear-gradient(90deg,rgba(255,0,0,0.03),rgba(0,255,0,0.01),rgba(0,0,255,0.03));background-size:100% 3px,3px 100%;pointer-events:none;}.vignette{background:radial-gradient(circle at center,transparent 55%,rgba(11,10,10,0.92) 100%);pointer-events:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "surface-tint": "#ffb3ad", "surface-bright": "#3b3939", "primary-fixed-dim": "#ffb3ad", "primary": "#ffb3ad", "on-error-container": "#ffdad6", "tertiary-container": "#cea72c", "surface-dim": "#141313", "paper": "#D8D2C4", "tertiary": "#ecc246", "on-primary-container": "#ff9d95", "error-container": "#93000a", "on-primary-fixed-variant": "#891c1d", "primary-fixed": "#ffdad6", "blood": "#8B1E1E", "on-tertiary-fixed": "#241a00", "inverse-surface": "#e6e1e1", "mold": "#3E4A3A", "primary-container": "#8b1e1e", "inverse-primary": "#aa3531", "warn": "#C9A227", "on-error": "#690005", "on-tertiary": "#3d2e00", "tertiary-fixed-dim": "#ecc246", "on-surface-variant": "#dfbfbc", "secondary-fixed": "#cde6f7", "on-tertiary-fixed-variant": "#584400", "outline-variant": "#58413f", "surface": "#141313", "surface-container-high": "#2b2a29", "on-surface": "#e6e1e1", "on-secondary": "#1b3340", "background": "#141313", "on-primary": "#680109", "surface-container-highest": "#363434", "surface-container": "#211f1f", "inverse-on-surface": "#323030", "surface-container-low": "#1d1b1b", "on-secondary-container": "#a3bccc", "error": "#ffb4ab", "surface-variant": "#363434", "outline": "#a68a87", "tertiary-fixed": "#ffe08e", "on-secondary-fixed-variant": "#324a57", "secondary-fixed-dim": "#b1cada", "on-tertiary-container": "#503d00", "on-primary-fixed": "#410003", "secondary": "#b1cada", "phone-glow": "#9FB8C8", "on-background": "#e6e1e1", "void": "#0B0A0A", "surface-container-lowest": "#0f0e0e", "on-secondary-fixed": "#031e2a", "secondary-container": "#344c5a" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1rem", "space-xl": "2.5rem", "space-lg": "1.5rem", "space-md": "1rem", "margin-mobile": "1rem", "margin": "3rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "gutter-mobile": "0.5rem" }, "fontFamily": { "document-body": [ "Special Elite" ], "hud-stat": [ "VT323" ], "hud-subtitle-mobile": [ "VT323" ], "display-title-mobile": [ "Rock Salt" ], "menu-item-mobile": [ "VT323" ], "menu-item": [ "VT323" ], "display-title": [ "Rock Salt" ], "document-heading": [ "Special Elite" ], "hud-prompt": [ "VT323" ], "hud-subtitle": [ "VT323" ], "terminal-caption": [ "VT323" ] }, "fontSize": { "document-body": [ "18px", { "lineHeight": "28px", "fontWeight": "400" } ], "hud-stat": [ "28px", { "lineHeight": "32px", "fontWeight": "400" } ], "hud-subtitle-mobile": [ "22px", { "lineHeight": "26px", "fontWeight": "400" } ], "display-title-mobile": [ "36px", { "lineHeight": "44px", "fontWeight": "400" } ], "menu-item-mobile": [ "28px", { "lineHeight": "36px", "fontWeight": "400" } ], "menu-item": [ "40px", { "lineHeight": "48px", "fontWeight": "400" } ], "display-title": [ "56px", { "lineHeight": "68px", "fontWeight": "400" } ], "document-heading": [ "24px", { "lineHeight": "32px", "fontWeight": "400" } ], "hud-prompt": [ "24px", { "lineHeight": "28px", "fontWeight": "400" } ], "hud-subtitle": [ "32px", { "lineHeight": "36px", "fontWeight": "400" } ], "terminal-caption": [ "18px", { "lineHeight": "22px", "fontWeight": "400" } ] } } } };</script></head><body class="bg-void text-on-surface antialiased select-none"><div class="fixed inset-0 z-40 crt-overlay"></div><div class="fixed inset-0 z-50 vignette"></div><main class="relative z-10 w-full min-h-screen bg-void flex items-center justify-center p-0 m-0"><div class="flex flex-col w-full relative select-none">
<!-- 16:9 Canvas Viewport Frame (Simulated Godot / PSX Display) -->
<div class="relative w-full aspect-[16/9] max-h-screen mx-auto overflow-hidden bg-void flex flex-col justify-between">
<!-- Background: Dithered Schoolyard Scene -->
<div class="absolute inset-0 z-0 bg-cover bg-center filter contrast-125 brightness-90" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBiBRvSOKtJXlixWvB_yvxjrhkb62CJqyv_1lrxFV4aOJlCijc001e557lGmx75w_wzBj6tKEIvnVJL5KoBMc-9j2_3yMh_cPebTIq98R2OigMekX1wnyg_N8BK1CRtYmZfaj9CKlUF4b7DmWt-5A5Vpu5VGCY3xRIs89_Cfv3mUMu_a_FGu3BcjtQ-VYNFhpfpxoGazfOdyi1wRp86zD3onMfHUpudNczYLieVctFMdz9wlDVENaE')">
<!-- Vignette and Peripheral Void Falloff -->
<div class="absolute inset-0 bg-gradient-to-t from-void via-transparent to-void/70 mix-blend-multiply"></div>
<div class="absolute inset-0 bg-gradient-to-r from-void via-void/40 to-transparent"></div>
</div>
<!-- Top Left Identity & Diagnostic Terminal -->
<header class="relative z-20 pt-margin pl-margin flex flex-col items-start space-y-space-xs pointer-events-none">
<!-- Title: Hand-Scratched Display Typo -->
<div class="relative">
<h1 class="font-display-title text-display-title text-paper tracking-wider select-none leading-none drop-shadow-[0_4px_12px_rgba(0,0,0,0.9)]">
          Charger Diana
        </h1>
<!-- Scratched Underline Accent -->
<div class="w-48 h-1 bg-blood mt-space-xs ml-1 shadow-[0_0_8px_rgba(139,30,30,0.8)]"></div>
</div>
<!-- Sub-title / Telemetry Header -->
<div class="pt-space-xs flex items-center space-x-space-sm font-terminal-caption text-terminal-caption text-paper/70 tracking-widest uppercase">
<span class="text-blood font-bold">[BUILD]</span>
<span>v0.9.1 - MALAM HARI DI SMAN 3</span>
</div>
</header>
<!-- Main Navigation Zone: Left Aligned Classic Godot List -->
<main class="relative z-20 pl-margin my-auto flex flex-col">
<nav aria-label="Menu Utama" class="flex flex-col space-y-space-sm w-fit" id="retro-menu">
<!-- Item 0: Mulai -->
<button class="menu-entry group text-left font-menu-item text-menu-item text-blood tracking-wider focus:outline-none transition-none cursor-pointer flex items-center" data-index="0" type="button">
<span class="pointer-glyph mr-space-sm">&gt;</span>
<span class="label tracking-widest drop-shadow-[2px_2px_0_#0B0A0A]">MULAI</span>
</button>
<!-- Item 1: Lanjutkan -->
<button class="menu-entry group text-left font-menu-item text-menu-item text-paper/85 tracking-wider focus:outline-none transition-none cursor-pointer flex items-center hover:text-blood" data-index="1" type="button">
<span class="pointer-glyph mr-space-sm opacity-0 group-hover:opacity-100">&gt;</span>
<span class="label tracking-widest drop-shadow-[2px_2px_0_#0B0A0A]">LANJUTKAN</span>
</button>
<!-- Item 2: Pengaturan -->
<button class="menu-entry group text-left font-menu-item text-menu-item text-paper/85 tracking-wider focus:outline-none transition-none cursor-pointer flex items-center hover:text-blood" data-index="2" type="button">
<span class="pointer-glyph mr-space-sm opacity-0 group-hover:opacity-100">&gt;</span>
<span class="label tracking-widest drop-shadow-[2px_2px_0_#0B0A0A]">PENGATURAN</span>
</button>
<!-- Item 3: Keluar -->
<button class="menu-entry group text-left font-menu-item text-menu-item text-paper/85 tracking-wider focus:outline-none transition-none cursor-pointer flex items-center hover:text-blood" data-index="3" type="button">
<span class="pointer-glyph mr-space-sm opacity-0 group-hover:opacity-100">&gt;</span>
<span class="label tracking-widest drop-shadow-[2px_2px_0_#0B0A0A]">KELUAR</span>
</button>
</nav>
</main>
<!-- Lower HUD Bar & Peripheral Telemetry -->
<footer class="relative z-20 pb-margin px-margin flex items-end justify-between pointer-events-none">
<!-- Input Bindings Legend (Bottom-Left) -->
<div class="flex items-center space-x-space-lg font-hud-prompt text-hud-prompt text-paper/60 drop-shadow-[1px_1px_0_#0B0A0A] tracking-wider">
<span class="flex items-center space-x-space-xs">
<span class="text-paper">[W/S]</span>
<span>NAVIGASI</span>
</span>
<span class="flex items-center space-x-space-xs">
<span class="text-paper">[ENTER]</span>
<span>PILIH</span>
</span>
</div>
<!-- Diegetic Feature: Nokia Mobile Phone Battery State (Bottom-Right) -->
<aside aria-label="Status Baterai Handphone" class="flex flex-col items-end space-y-space-xs">
<div class="flex items-center space-x-space-sm">
<!-- Pixel Battery Frame -->
<div class="flex items-center space-x-1 p-1 bg-void/90">
<!-- Terminal Stepped Cells (1 Filled Warning, 3 Depleted) -->
<div class="w-2.5 h-4 bg-warn animate-pulse"></div>
<div class="w-2.5 h-4 bg-mold/40"></div>
<div class="w-2.5 h-4 bg-mold/40"></div>
<div class="w-2.5 h-4 bg-mold/40"></div>
<!-- Battery Anode Cap -->
<div class="w-1 h-2 bg-mold/60 -mr-1"></div>
</div>
<!-- Battery Stat Value -->
<span class="font-hud-stat text-hud-stat text-warn leading-none drop-shadow-[2px_2px_0_#0B0A0A]">
            3%
          </span>
</div>
<!-- Abrupt Indonesian Status Text -->
<span class="font-terminal-caption text-terminal-caption text-warn tracking-widest uppercase drop-shadow-[1px_1px_0_#0B0A0A]">
          BATERAI LEMAH
        </span>
</aside>
</footer>
<!-- Interactive Subtle Sound & Flash Feedback Layer (Toggled via JS) -->
<div class="absolute inset-0 bg-blood opacity-0 pointer-events-none z-30 transition-opacity duration-75" id="selection-flash"></div>
</div>
<script>
    (() => {
      const items = document.querySelectorAll('.menu-entry');
      const flash = document.getElementById('selection-flash');
      let currentIndex = 0;

      function updateMenu(newIndex) {
        items.forEach((item, idx) => {
          const glyph = item.querySelector('.pointer-glyph');
          const isSelected = idx === newIndex;
          
          if (isSelected) {
            item.classList.remove('text-paper/85');
            item.classList.add('text-blood');
            glyph.classList.remove('opacity-0');
            glyph.classList.add('opacity-100');
          } else {
            item.classList.remove('text-blood');
            item.classList.add('text-paper/85');
            glyph.classList.remove('opacity-100');
            glyph.classList.add('opacity-0');
          }
        });
        currentIndex = newIndex;
      }

      function triggerSelect() {
        if (!flash) return;
        flash.classList.remove('opacity-0');
        flash.classList.add('opacity-40');
        setTimeout(() => {
          flash.classList.remove('opacity-40');
          flash.classList.add('opacity-0');
        }, 90);
      }

      // Keyboard Listeners for authentic PS1 / Godot menu feel
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
          const nextIndex = (currentIndex - 1 + items.length) % items.length;
          updateMenu(nextIndex);
        } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
          const nextIndex = (currentIndex + 1) % items.length;
          updateMenu(nextIndex);
        } else if (e.key === 'Enter' || e.key === ' ') {
          triggerSelect();
        }
      });

      // Mouse Hover Support
      items.forEach((item, idx) => {
        item.addEventListener('mouseenter', () => updateMenu(idx));
        item.addEventListener('click', triggerSelect);
      });
    })();
  </script>
</div></main></body></html>
