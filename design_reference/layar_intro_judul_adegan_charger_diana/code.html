<!-- Top Telemetry (Silent Vintage Camera / Surveillance Stamp) -->
<div class="w-full flex justify-between items-start text-mold font-terminal-caption text-terminal-caption tracking-widest pt-space-md opacity-60">
<div class="flex items-center space-x-space-sm">
<span class="inline-block w-2 h-2 bg-blood animate-pulse"></span>
<span class="tracking-widest uppercase">REC • CH-02 [KLS-XI]</span>
</div>
<div class="font-terminal-caption text-terminal-caption tracking-widest">
      NTSC-J // 15.734 kHz
    </div>
</div>
<!-- Center Stage: Minimalist Psychological Dread Header & Status -->
<div class="flex flex-col items-center justify-center my-auto text-center px-margin-mobile">
<!-- Scene Title (Stark, Crisp, Bitmap Typography) -->
<h1 class="font-menu-item text-menu-item text-paper tracking-[0.2em] uppercase leading-none drop-shadow-[2px_2px_0px_#0B0A0A]">
      23:47 — SMAN, Ruang Kelas XI
    </h1>
<!-- Secondary Telemetry / Phone Battery Status -->
<div class="flex items-center justify-center mt-space-md space-x-space-sm text-warn font-hud-stat text-hud-stat tracking-wider">
<span class="inline-block tracking-widest uppercase">HP 34%</span>
<span class="text-mold font-hud-stat text-hud-stat">[</span>
<span class="flex items-center space-x-1">
<span class="inline-block w-2.5 h-3.5 bg-warn"></span>
<span class="inline-block w-2.5 h-3.5 bg-warn"></span>
<span class="inline-block w-2.5 h-3.5 bg-warn"></span>
<span class="inline-block w-2.5 h-3.5 bg-mold"></span>
<span class="inline-block w-2.5 h-3.5 bg-mold"></span>
</span>
<span class="text-mold font-hud-stat text-hud-stat">]</span>
</div>
<!-- Hidden Subliminal Prompt: Dies on keypress -->
<div class="h-6 mt-space-lg text-mold font-terminal-caption text-terminal-caption tracking-widest opacity-0 transition-opacity duration-1000" id="subliminal-quote">
      DIANA BELUM KELUAR DARI RUANGAN
    </div>
</div>
<!-- Bottom Interactive Cue & Audio Hint -->
<div class="w-full pb-space-lg flex flex-col items-center justify-center">
<div class="cursor-pointer font-hud-prompt text-hud-prompt text-paper opacity-80 tracking-widest hover:text-blood transition-colors flex items-center space-x-space-sm" id="continue-prompt">
<span class="text-mold">&gt;</span>
<span>[ SPASI ] LANJUT</span>
<span class="inline-block w-2.5 h-5 bg-paper align-middle animate-[pulse_1s_infinite]"></span>
</div>
<!-- Muted System Footer Stamp -->
<div class="mt-space-sm font-terminal-caption text-terminal-caption text-mold opacity-40 tracking-widest uppercase">
      MEMORI INTERNAL TERSEDIA • SLOT 1 [TERISI]
    </div>
</div>
</div>
<script>
  (function() {
    const subliminal = document.getElementById('subliminal-quote');
    const prompt = document.getElementById('continue-prompt');
    let triggered = false;

    // Subliminal flickers after 3.5 seconds of lonely silence
    setTimeout(() => {
      if (subliminal) {
        subliminal.classList.remove('opacity-0');
        subliminal.classList.add('opacity-40');
      }
    }, 3500);

    // Audio cue trigger / Screen transition mock
    function proceed() {
      if (triggered) return;
      triggered = true;
      if (prompt) {
        prompt.classList.remove('text-paper');
        prompt.classList.add('text-blood');
        prompt.innerHTML = '<span class="text-blood">&gt;</span> MEMUAT DATA RUANGAN...';
      }
      setTimeout(() => {
        document.body.style.opacity = '0';
        document.body.style.transition = 'opacity 0.7s steps(4)';
      }, 300);
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        proceed();
      }
    });

    if (prompt) {
      prompt.addEventListener('click', proceed);
    }
  })();
</script></main></body></html>
